name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Principe du moindre privilège
permissions:
  contents: read

# Annulation automatique des builds obsolètes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      - name: Configuration de Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation exacte des dépendances
        run: npm ci

      - name: Exécution des tests
        run: npm test

  deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      - name: Configuration de Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation exacte
        run: npm ci

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high
  
  image:
    needs: [test, deps-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image Docker avec cache GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devsecops-tp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Trivy (Action épinglée par SHA)
        uses: aquasec/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'devsecops-tp:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
        