name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Principe du moindre privilège
permissions:
  contents: read

# Annulation automatique des builds obsolètes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      - name: Configuration de Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation exacte des dépendances
        run: npm ci

      - name: Exécution des tests
        run: npm test

  deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      - name: Configuration de Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation exacte
        run: npm ci

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high