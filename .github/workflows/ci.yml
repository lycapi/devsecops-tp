name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Principe du moindre privilège
permissions:
  contents: read

# Annulation automatique des builds obsolètes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      - name: Configuration de Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation exacte des dépendances
        run: npm ci

      - name: Exécution des tests
        run: npm test

  deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      - name: Configuration de Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation exacte
        run: npm ci

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high
  
  image:
    needs: [test, deps-audit]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image Docker avec cache GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devsecops-tp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Trivy (Action épinglée par SHA)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: devsecops-tp:${{ github.sha }}
          format: 'table'
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: 'os'
          severity: 'CRITICAL,HIGH'
